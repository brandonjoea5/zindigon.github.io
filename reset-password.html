<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Reset Password — Zindigon</title>
  <link rel="stylesheet" href="assets/site.css"/>
</head>
<body>

<div id="fx" aria-hidden="true">
  <div class="fx-grid"></div><div class="fx-glow"></div><div class="fx-grain"></div>
</div>

<div class="center-shell">
  <div class="auth-card">
    <a class="brand" href="/">
      <span class="brand-mark"><svg viewBox="0 0 16 16"><path d="M2 3 L14 3 L2 13 L14 13"/></svg></span>
      <span class="brand-name">Zindigon<em>studio</em></span>
    </a>
    <h1>Reset password</h1>
    <p>Enter a new password below. Six characters minimum.</p>
    <form class="form" style="margin-top:22px;" onsubmit="event.preventDefault(); resetPassword();">
      <div class="field">
        <label for="password">New password</label>
        <input class="input" id="password" type="password" required minlength="6" autocomplete="new-password"/>
      </div>
      <div class="field">
        <label for="confirm">Confirm</label>
        <input class="input" id="confirm" type="password" required minlength="6" autocomplete="new-password"/>
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn">Reset password <span class="arrow">→</span></button>
    </form>
    <div class="auth-status" id="status">Ready.</div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const status = document.getElementById('status');
  const setStatus = (msg, kind='') => {
    status.textContent = msg;
    status.className = 'auth-status' + (kind ? ' ' + kind : '');
  };
  if (!token) setStatus('Invalid reset link.', 'error');

  async function resetPassword() {
    const pass = document.getElementById('password').value;
    const conf = document.getElementById('confirm').value;
    if (pass.length < 6) return setStatus('Password must be at least 6 characters.', 'error');
    if (pass !== conf) return setStatus('Passwords do not match.', 'error');
    setStatus('Resetting…');
    try {
      const r = await fetch(
        'https://realmhealthbackend-911490376.development.catalystserverless.com/server/resetpassword/reset',
        { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ token, new_password: pass }) }
      );
      const text = await r.text();
      let data = null; try { data = JSON.parse(text); } catch {}
      if (!r.ok) return setStatus(`HTTP ${r.status}: ${data?.message || text.slice(0,200)}`, 'error');
      if (data?.success) return setStatus('Password reset successful. You may return to the app.', 'ok');
      setStatus(data?.message || 'Reset failed or link expired.', 'error');
    } catch (err) {
      setStatus('Network error: ' + (err?.message || err), 'error');
    }
  }
</script>
</body>
</html>
