<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bloodline Zero: Checkout</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/bloodline-zero/style.css"/>
</head>
<body class="bz">
  <div class="bz-bg" aria-hidden="true"></div>
  <div class="bz-grain" aria-hidden="true"></div>
  <div class="bz-fog" aria-hidden="true"></div>

  <header class="bz-header">
    <nav class="bz-nav" id="bzNav">
      <a class="bz-brand" href="/bloodline-zero/">
        <svg class="bz-mark" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M10 2.5 L10 9 M10 9 L4.5 17.5 M10 9 L15.5 17.5"/>
          <path class="bz-mark-bar" d="M6.5 5.5 L13.5 5.5"/>
        </svg>
        <span class="bz-brand-text">Bloodline Zero <small>Zindigon</small></span>
      </a>
      <div class="bz-nav-links" data-nav>
        <a href="/bloodline-zero/#directory" class="bz-nav-primary">Episodes</a>
        <a href="/bloodline-zero/library.html">My Library</a>
      </div>
      <div class="bz-account" id="bzAccountBar"></div>
      <button class="bz-menu-btn" id="bzMenuBtn" type="button" aria-expanded="false" aria-controls="bzNav">Menu</button>
    </nav>
  </header>

  <main>
    <section class="bz-checkout-state">
      <div class="bz-container">
        <h1>Checkout cancelled</h1>
        <p>Nothing was charged. Your selection wasn't saved, but the episodes are exactly where you left them.</p>
        <a class="bz-btn bz-btn-primary" href="/bloodline-zero/#directory">Back to Episodes</a>
      </div>
    </section>
  </main>

  <footer class="bz-footer">
    <div class="bz-container" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; width:100%;">
      <span>Bloodline Zero, an original series by Brandon Anderson.</span>
      <a href="/">zindigon.com</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="/assets/auth-shared.js" defer></script>
  <script src="/bloodline-zero/bz-api.js" defer></script>
  <script src="/bloodline-zero/bz-account.js" defer></script>
  <script src="/bloodline-zero/bz-nav.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => { bzInitAccount(); });
  </script>
</body>
</html>
